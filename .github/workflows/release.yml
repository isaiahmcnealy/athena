name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a migration or allow two releases to deploy concurrently.
concurrency:
  group: athena-release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    # The cloud host is x86-64. An ARM host needs an ARM64 runner and platform here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      # Disposable values for the smoke test only; the server keeps its own in ~/athena/.env.
      ATHENA_IMAGE: athena:release
      POSTGRES_PASSWORD: ci-disposable-owner
      ATHENA_WEB_DB_PASSWORD: ci-disposable-web
      ATHENA_INGEST_DB_PASSWORD: ci-disposable-ingest
      ATHENA_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Build AMD64 image
        run: >-
          docker build --platform linux/amd64 --tag athena:release
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Test migrations, roles, readiness, and the public boundary in the release containers
        run: |
          compose=(docker compose -p athena-smoke -f deploy/compose.yaml)
          "${compose[@]}" up -d --wait --wait-timeout 120 db
          "${compose[@]}" run --rm --no-deps migrate
          "${compose[@]}" exec -T db psql -U athena -d athena -v ON_ERROR_STOP=1 -q -f - < deploy/roles.sql
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 120 web
          curl --fail --silent http://127.0.0.1:8001/api/papers > /dev/null
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 120 caddy
          # localhost gets a certificate from Caddy's internal authority, hence --insecure.
          curl --fail --silent --insecure https://localhost/api/papers > /dev/null
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://localhost/metrics)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 308
          # The web role must not be able to write, and the importer must not change the schema.
          # Written as if-blocks because "set -e" ignores the status of a negated command.
          if "${compose[@]}" exec -T db psql -U athena_web -d athena -v ON_ERROR_STOP=1 \
            -c 'SET default_transaction_read_only = off' -c 'DELETE FROM papers'; then
            echo 'The web role was able to delete catalog rows.' >&2; exit 1
          fi
          if "${compose[@]}" exec -T db psql -U athena_ingest -d athena -v ON_ERROR_STOP=1 \
            -c 'DROP TABLE papers'; then
            echo 'The importer role was able to drop a table.' >&2; exit 1
          fi
          "${compose[@]}" run --rm --no-deps ingest stats > /dev/null
      - name: Remove disposable test containers
        if: always()
        run: docker compose -p athena-smoke -f deploy/compose.yaml down --volumes
      - name: Publish the tested image
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag athena:release "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          [[ "$digest" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    # Repository variable: publishing works before the server has been configured.
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      ATHENA_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Join the private deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:athena-ci
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PUBLIC_URL" =~ ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          [[ "$ATHENA_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CONFIG'
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 3
          CONFIG
      - name: Back up, migrate, and deploy
        run: |
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$target" "umask 077; mkdir -p athena/releases/$release"
          scp deploy/compose.yaml deploy/Caddyfile deploy/roles.sql deploy/deploy.sh \
            deploy/manage.sh deploy/backup.sh deploy/refresh.sh "$target:athena/releases/$release/"
          ssh "$target" "bash athena/releases/$release/deploy.sh '$ATHENA_IMAGE'"
      - name: Verify the public HTTPS endpoint
        # Certificate validation is on: this fails on a wrong hostname, bad DNS, or expired TLS.
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "$PUBLIC_URL/health/ready" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/metrics")" = 404
